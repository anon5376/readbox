name: Build apps

# Installers are built on request (Actions tab → Build apps → Run workflow) or
# for a version tag, not on every push. Pushing a tag like v0.1.0 also
# publishes a GitHub release with the Mac, Windows and extension downloads,
# using docs/releases/<tag>.md as its notes.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test
        working-directory: src-tauri
      - run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Readbox-Windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # One .dmg that runs on both Apple Silicon and Intel Macs.
      - run: npm run tauri build -- --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Readbox-Mac
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: Readbox-browser-extension
          path: extension/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - run: cd dist/Readbox-browser-extension && zip -r ../Readbox-browser-extension.zip .
      - run: >
          gh release create "$GITHUB_REF_NAME"
          dist/Readbox-Mac/*.dmg
          dist/Readbox-Windows-installer/*.exe
          dist/Readbox-browser-extension.zip
          --title "Readbox ${GITHUB_REF_NAME#v}"
          --notes-file "docs/releases/$GITHUB_REF_NAME.md"
        env:
          GH_TOKEN: ${{ github.token }}
