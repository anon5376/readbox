<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4693a"/>
      <stop offset="1" stop-color="#a8431f"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf5"/>
      <stop offset="1" stop-color="#f6e7da"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#5a1f08" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px rounded square centred on the canvas -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>
  <!-- page with a folded corner -->
  <g filter="url(#shadow)">
    <path d="M352 236h232l112 112v300H352z" fill="url(#paper)"/>
    <path d="M584 236v112h112" fill="#ecd3bf"/>
    <rect x="410" y="400" width="200" height="22" rx="11" fill="#d9b49a"/>
    <rect x="410" y="452" width="226" height="22" rx="11" fill="#e4c5ae"/>
    <rect x="410" y="504" width="170" height="22" rx="11" fill="#e4c5ae"/>
  </g>
  <!-- tray -->
  <g filter="url(#shadow)">
    <path d="M232 560h166l44 70h140l44-70h166v188a44 44 0 0 1-44 44H276a44 44 0 0 1-44-44z" fill="#fff7f0"/>
